services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: flight-admin-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped


  flight-admin-service:
    image: host.docker.internal:8081/flight-admin-onprem/flight-admin-service:0.0.1
    container_name: flight-admin-service

    depends_on:
      sqlserver:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=flight_admin;encrypt=true;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: "sa"
      SPRING_DATASOURCE_PASSWORD: "${MSSQL_SA_PASSWORD}"

    ports:
      - "8080:8080"

    restart: unless-stopped


volumes:
  sqlserver-data: