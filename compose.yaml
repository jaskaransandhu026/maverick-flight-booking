services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: flight-admin-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"

    ports:
      - "1433:1433"

    networks:
      - flight-network

    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped


  flight-admin-service:
    image: host.docker.internal:8081/flight-admin-onprem/flight-admin-service:latest
    pull_policy: always
    container_name: flight-admin-service

    depends_on:
      sqlserver:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=flight_admin;encrypt=true;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: "sa"
      SPRING_DATASOURCE_PASSWORD: "${MSSQL_SA_PASSWORD}"

    ports:
      - "8080:8080"

    networks:
      - flight-network

    restart: unless-stopped


  kong:
    image: kong:3.9.3

    container_name: flight-kong

    environment:
      KONG_DATABASE: "off" #using db-less mode for now

      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml

      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr

      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr

      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001

    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro

    ports:
      - "8000:8000"

      # Admin API accessible only from this machine.
      - "127.0.0.1:8001:8001"

    networks:
      - flight-network

    restart: unless-stopped

volumes:
  sqlserver-data:

networks:
  flight-network:
    driver: bridge